<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="https://codehs.com/uploads/8b9194b944728ceaff1e648dfec3f693" type="image">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #myIframe {
      display: none;
    }
    button {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <iframe src="https://goshadow.net/"></iframe>

  <button id="toggleButton">Show iFrame</button>
  <iframe id="myIframe" src="https://join.wewillwrite.com/"></iframe>

  <script>
    const button = document.getElementById('toggleButton');
    const iframe = document.getElementById('myIframe');

    button.addEventListener('click', () => {
      if (iframe.style.display === 'none') {
        iframe.style.display = 'block';
        button.textContent = 'Hide iFrame';
      } else {
        iframe.style.display = 'none';
        button.textContent = 'Show iFrame';
      }
    });
  </script>
</body>
